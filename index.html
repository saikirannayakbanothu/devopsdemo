<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 15px;
            font-size: 40px;
        }

        .success {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .details {
            text-align: left;
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            background: #e6f7ed;
            color: #16834b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps Demo</h1>

        <div class="success">
            <span class="badge">Deployment Successful</span>
        </div>

        <div class="details">
            <strong>Application:</strong> DevOps Demo<br>
            <strong>CI/CD:</strong> Jenkins<br>
            <strong>Container:</strong> Docker<br>
            <strong>Server:</strong> GCP<br>
            <strong>Web Server:</strong> Nginx<br>
            <strong>Status:</strong> Running Successfully
        </div>

    </div>

</body>
</html>
